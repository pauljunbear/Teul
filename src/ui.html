<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Teul</title>
    <style>body{margin:0;padding:0;overflow:hidden;-webkit-font-smoothing:antialiased}button svg{flex:none}button:disabled{cursor:not-allowed!important;opacity:.55}input::placeholder,textarea::placeholder{color:var(--teul-placeholder,#8a8a8a);opacity:1}:focus-visible{outline:2px solid var(--teul-focus,#3b82f6)!important;outline-offset:2px}*{scrollbar-width:thin;scrollbar-color:var(--teul-thumb,rgba(128,128,128,.4)) transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--teul-thumb,rgba(128,128,128,.4));border-radius:8px;border:2px solid transparent;background-clip:padding-box}.teul-noscrollbar{scrollbar-width:none}.teul-noscrollbar::-webkit-scrollbar{display:none}.teul-hover:hover:not(:disabled){box-shadow:inset 0 0 0 999px var(--teul-hover,rgba(128,128,128,.08))}.teul-card:hover:not(:disabled):not([aria-pressed=true]){border-color:var(--teul-border-strong,#888)!important}.teul-tile{transition:transform .15s ease}.teul-tile:hover{transform:scale(1.03)}.teul-combo:hover>span:first-child{box-shadow:0 0 0 2px var(--teul-text,#fff)}.teul-sheet{animation:teul-sheet-in .28s cubic-bezier(.23,1,.32,1)}@keyframes teul-sheet-in{from{transform:translateY(100%)}}.teul-summary{list-style:none}.teul-summary::-webkit-details-marker{display:none}.teul-summary::before{content:'';display:inline-block;width:0;height:0;margin:0 8px 1px 1px;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s ease}details[open]>.teul-summary::before{transform:rotate(90deg)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.teul-tile:hover{transform:none}.teul-sheet{animation:none}}</style>
  </head>
  <body>
    <div id="react-page"></div>
  </body>
</html>
